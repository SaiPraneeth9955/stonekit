name: stonekit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.15.0+cu132
      - nnunetv2
      - TotalSegmentator
      - nibabel
      - SimpleITK
      - numpy
      - scipy
      - scikit-image
      - pandas
      - pyarrow
      - statsmodels
      - patsy
      - pingouin
      - matplotlib
      - plotly
      - streamlit
      - pyyaml
      - typer
      - rich
      - pytest
      - ruff
      - -e .
